<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc mừng 20-10 Vợ Yêu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #2b0015, #000000);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
            text-align: center;
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 105, 180, 0.2);
            animation: fadeIn 2s ease-in-out;
            max-width: 90%;
        }

        h1 {
            font-size: 3rem;
            color: #ff69b4;
            text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493, 0 0 30px #ff1493;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 2rem;
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ff8c00;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #ffe4e1;
        }

        .heart {
            position: absolute;
            top: -10vh;
            color: #ff69b4;
            font-size: 20px;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Chúc Mừng 20/10</h1>
        <h2>Huỳnh Thị Mỹ Linh</h2>
        <p>Chúc vợ yêu của anh có một ngày 20/10 thật vui vẻ, hạnh phúc và luôn xinh đẹp.<br>Cảm ơn em vì đã luôn đồng hành cùng anh!</p>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement("div");
            heart.innerHTML = "❤";
            heart.classList.add("heart");
            
            // Randomize position, size, and animation duration
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = Math.random() * 20 + 10 + "px";
            heart.style.animationDuration = Math.random() * 3 + 2 + "s";
            
            // Randomize color slightly for variety
            const colors = ['#ff69b4', '#ff1493', '#ffc0cb', '#db7093'];
            heart.style.color = colors[Math.floor(Math.random() * colors.length)];

            document.body.appendChild(heart);

            // Remove heart after it falls to keep DOM clean
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        // Generate hearts every 150ms
        setInterval(createHeart, 150);
    </script>
</body>
</html>
